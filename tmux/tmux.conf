source-file ~/.config/tmux/tmux.reset.conf

# RESET PREFIX
unbind d
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# SESSION MANAGEMENT

# 切换相邻 session
bind _ switch-client -p
bind + switch-client -n
# prefix + shift+数字 切换到对应 session
bind ! switch-client -t 1
bind @ switch-client -t 2
bind '#' switch-client -t 3
bind $ switch-client -t 4
bind % switch-client -t 5
bind ^ switch-client -t 6
bind & switch-client -t 7
bind * switch-client -t 8
bind ( switch-client -t 9
bind ) switch-client -t 0
bind - previous-window
bind = next-window
# Prefix + N 创建新 session
bind N command-prompt -p "New Session Name:" "new-session -s '%%'"
# Prefix + R 重命名当前 session
bind R command-prompt -I "#S" "rename-session '%%'"

# WINDOW MANAGEMENT
unbind r
bind r command-prompt -I "#W" "rename-window '%%'"
unbind n
bind n new-window
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind n command-prompt -p "New Window Name (optional):" "new-window -n '%%'"
# prefix + < / > 左右移动当前窗口位置（-d 让焦点跟随被移动的标签）
bind < swap-window -d -t -1
bind > swap-window -d -t +1

set -g base-index 1
set -g renumber-windows on

# PANE MANAGEMENT
bind V split-window -h
bind H split-window -v

# SELECT & COPY
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
# H/L 跳转行首/行尾
bind-key -T copy-mode-vi H send -X start-of-line
bind-key -T copy-mode-vi L send -X end-of-line
# J/K 上下移动15行（copy 模式的普通导航与选择状态共用同一 key table）
bind-key -T copy-mode-vi J send -X -N 15 cursor-down
bind-key -T copy-mode-vi K send -X -N 15 cursor-up
set -g set-clipboard on
set -g mouse on

# APPEARENCE
set -g detach-on-destroy off
set -g status-position top
set -g default-terminal "${TERM}"
set -g status-interval 5

# Refresh status bar immediately after switching sessions
set-hook -g client-session-changed 'refresh-client -S'

setw -g mode-keys vi

set-option -g allow-rename off

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-sessionist'
set -g @sessionist-goto 'f'
set -g @sessionist-alternate ''
set -g @sessionist-new ''
set -g @sessionist-promote-pane ''
set -g @sessionist-promote-window ''
set -g @sessionist-join-pane ''
set -g @sessionist-kill-session ''

set -g mouse on
set -g default-terminal "tmux-256color"


set -g @plugin 'omerxx/tmux-floax'

set -g @plugin 'laktak/extrakto'

set -g @plugin 'AndreVicencio/tmux-flash'

# ====== onedarkpro 配色（与 nvim 的 onedark 主题完全一致）======
# palette:
#   bg #282c34  fg #abb2bf  comment #7f848e  gray #5c6370
#   red #e06c75  green #98c379  blue #61afef  cyan #56b6c2
#   orange #d19a66  yellow #e5c07b  purple #c678dd  highlight #e2be7d

# 状态栏透明（对应 onedarkpro transparency=true）
set -g status-style "default"

# 消息/提示（重命名、命令提示等）：蓝色文字、透明背景
set -g message-style "fg=#61afef,bg=default,align=centre"
set -g message-command-style "fg=#61afef,bg=default,align=centre"

# 窗格边框：未激活灰 #5c6370，激活蓝 #61afef
set -g pane-border-style "fg=#5c6370"
set -g pane-active-border-style "fg=#61afef"

# 复制模式指示器
set -g mode-style "bg=#2d313b,fg=#abb2bf,bold"

# 选项卡：无边框，仅 序号+名称 字样
# 未激活为注释灰 #7f848e，激活为蓝 #61afef
set -g window-status-format "#[fg=#7f848e] #I #W "
set -g window-status-current-format "#[fg=#61afef,bold] #I #W "
set -g window-status-separator " "
set -g status-justify left

# Tabs (window list) on the LEFT, session list on the RIGHT.
# status-justify left (above) keeps the window list left-aligned; with an empty
# status-left the tabs sit at the far left edge.
set -g status-left ""
set -g status-right-length 100
set -g status-right "#(~/.config/tmux/scripts/session_list.sh) #{?command_prompt,#[fg=#e06c75,bold][CMD]#[default],}"


# TPM
run-shell ~/.config/tmux/plugins/tpm/tpm
